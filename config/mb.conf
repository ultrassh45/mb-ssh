# mb-ssh2 — konfigurasi SSH product (per node)
# PORT_POOL: port Cloudflare untuk edge (TIDAK boleh tabrakan: 22, 80, 443)
# Kapasitas = jumlah port pool (tanpa UDP) / 2 (SSH+UDP per akun)
PORT_POOL="8080 8880 2052 2082 2086 2053 2083 2087 2096 8443"

# Domain node (untuk client-info + stunnel cert SAN opsional)
DOMAIN=""

# Interface WARP (kosong = auto-detect; set manual utk deterministik)
WARP_IF=""

# Backup state+config ke Cloudflare R2 (kosong = off)
# R2_REMOTE = nama rclone remote (rclone config buat: r2, access_key/secret_key)
R2_REMOTE=""
R2_PATH="mb-ssh/$(hostname)"

# pesan support di MOTD (WA link, website, dll)
SUPPORT="https://zxpedia.net"
