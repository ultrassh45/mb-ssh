# stunnel — SSH TLS backend (127.0.0.1:22443 → dropbear 127.0.0.1:22022)
#
# Kompatibilitas:
#  - Debian/Ubuntu pakai SysV init (/etc/init.d/stunnel4) yang WAJIB punya pid=
#    dan MENOLAK "foreground = yes" di file service (service langsung failed).
#  - "foreground" hanya valid untuk stunnel native systemd / container.
#  Maka: pakai pid= + output= (log), tanpa foreground.
[global]
pid = /var/run/stunnel4/mb-ssh.pid
output = /var/log/stunnel/mb-ssh.log
cert = /etc/mb-ssh2/cert.pem
key = /etc/mb-ssh2/key.pem

[mb-ssh]
accept  = 127.0.0.1:22443
connect = 127.0.0.1:22022
client  = no
